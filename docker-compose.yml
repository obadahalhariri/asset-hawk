services:
  postgres:
    image: postgres:16.4-alpine
    container_name: assethawk_postgres
    restart: unless-stopped

    # postgres:16.4-alpine akzeptiert nur die Umgebungsvariablen POSTGRES_DB, POSTGRES_USER und POSTGRES_PASSWORD
    environment:
      POSTGRES_DB: ${POSTGRES_DB_NAME}
      POSTGRES_USER: ${POSTGRES_DB_USER}
      POSTGRES_PASSWORD: ${POSTGRES_DB_PASSWORD}
    
    ports:
    # HOST_IP:HOST_PORT:CONTAINER_PORT
    # Nur an 127.0.0.1 binden, damit die DB nicht versehentlich im lokalen Netzwerk offen steht
      - "127.0.0.1:${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    name: assethawk_postgres_data
    driver: local # standardmäßig wird der lokale Treiber (driver) verwendet.
